            background: linear-gradient(135deg, #007bff, #3399ff);

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border-radius: 10px;
        }

        .hidden {
            display: none;
        }

        .nav-logo-link {

            align-items: center;
            text-decoration: none;

    const galleryContainer = document.getElementById("galleryContainer");

    function createGalleryItems(list, type) {
        return list.map(url => {
            const div = document.createElement("div");
            div.className = `gallery-item ${type} ${type !== 'album' ? 'hidden' : ''}`;
            div.innerHTML = `<img src="${url}" alt="${type} release">`;
            return div;
        });
    }

    function renderGallery() {
        const allItems = [
            ...createGalleryItems(albums, 'album'),
            ...createGalleryItems(singles, 'single'),
            ...createGalleryItems(clients, 'client')
        ];
        allItems.forEach(item => galleryContainer.appendChild(item));
    }

    function updateImageCounters() {
        document.getElementById("albumCount").innerText = albums.length;
        document.getElementById("singleCount").innerText = singles.length;
        document.getElementById("clientCount").innerText = clients.length;

        const total = albums.length + singles.length + clients.length;
        document.getElementById("totalImageCount").innerText = total;
    }

    function filterItems(type, event) {
        const types = ['album', 'single', 'client'];
        types.forEach(t => {
            document.querySelectorAll('.' + t).forEach(el => {
                el.classList.toggle('hidden', t !== type);
            });
        });

        document.querySelectorAll('.btn').forEach(btn => {
            btn.classList.remove('active');
        });

        if (event) event.target.classList.add('active');
    }

    function toggleMenu() {
        const navLinks = document.getElementById('navLinks');
        navLinks.classList.toggle('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderGallery();
        updateImageCounters();
    });
</script>
